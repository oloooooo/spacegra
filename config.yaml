# 本项目新增的配置（不属于 aegra 原生）。
# 逐键说明：docs/configuration.md §3.2
#
# 什么放这里：非密钥的项目参数（配额、会话文件上限、对象存储地址、知识空间、发件箱）。
# 什么不放这里：
#   - 密钥 -> .env（JWT_SECRET / PASSWORD_PEPPER / S3_ACCESS_KEY /
#     S3_SECRET_KEY / OPENAI_API_KEY）
#   - aegra 原生配置 -> aegra.json、src/aegra_api/settings.py（.env 里的 HOST/PORT/POSTGRES_* 等）
#
# 优先级：同名环境变量 > 本文件 > 代码内默认值（shared/config.py）。
# 改完要重启进程；值类型写错会直接启动失败。

# --- 配额（custom/service/quota.py，ADR-0012）---
quota:
  # 一个账号最多同时拥有几个会话（主管线程 + 子线程，子线程计到所属主管上）。
  # 超额时 POST /threads 返回 403；超管不受限。
  max_threads_per_user: 200

# --- 身份与 token（custom/service/account.py、custom/middleware/auth.py）---
auth:
  # 内部服务身份名：子 agent 线程的属主，鉴权中间件对它就免查库放行。
  # shared/token.py 与 graphs/access/spaces.py 共用这一个值，改了旧子线程属主就对不上。
  service_identity: subagent_service
  # 【只影响用户】access token 有效期（秒）。
  # 登录/注册签发的用户 token 用它；子 agent 的服务 token 写死 10 年，不受此值影响。
  access_token_ttl: 3600

# --- 会话文件 md（shared/session/store.py）---
# main 已移除上传入口，这三项只剩底座在用（保留给后续分支，删了会让 store.py 启动即炸）
session_files:
  max_upload_mb: 10             # 单文件上限
  max_files_per_session: 50     # 每会话文件数
  upload_ttl_minutes: 4320      # 孤儿保留期（72h），语义是「最后读取后多久」

# --- xlsx 工具（graphs/tools/xlsx/）---
xlsx:
  max_blob_mb: 10               # 单个 xlsx 的 HTTP 上限（当前无入口，保留）
  max_cells: 2000000            # 结构性硬闸，超了第一次调工具就报错
  max_xlsx_files_per_session: 20  # 当前无入口，保留
  max_md_files_per_session: 10   # 未生效：md 个数上限走 session_files.max_files_per_session
  max_blob_mb_per_user: 2048    # 每用户二进制总量（2GB）；当前无入口，保留
  cache_dir: .cache/xlsx        # 派生缓存与下载字节的本机目录，必须在 okf.dir（knowledge/）之外
  query_budget_ms: 5000         # 单次 where 查询的 CPU 预算，超了 interrupt()
  # where 谓词的校验强度。strict = 语法树白名单（只放行筛选/比较/少量函数，
  # 见 graphs/tools/xlsx/duck.py 的 _ALLOWED_NODES/_ALLOWED_FUNCTIONS）；
  # free = 只拦多条语句与注释，谓词原样交给 DuckDB —— 等于允许子查询、表函数，
  # s3 模式下就能读到凭证可达的任意对象，只在完全可信的环境里改。
  sql_policy: strict
  # 表第一次被查时按 sheet 转成 Parquet（内容哈希 + header 决定目录），之后走 DuckDB。
  cache_mode: local             # local = 只落本机；s3 = 写对象存储且查询直读（多实例无需本地缓存目录）
  cache_prefix: xlsx-derived    # cache_mode=s3 时的对象前缀（内容寻址，可随时清）
  cache_local_max_mb: 2048      # 本机派生缓存的总预算（s3 模式下本地那份只是建缓存时的副产物）

# --- 对象存储（shared/session/blobs.py，ADR-0016）---
# 凭证**不在这里**，写 .env：S3_ACCESS_KEY / S3_SECRET_KEY（密钥不进 git）。
s3:
  # 空 = 不启用对象存储（okf.backend 只能填 local）。
  endpoint: ""
  bucket: aegra-blobs
  region: us-east-1

  # 【启用示例 1：本地 SeaweedFS】（起网关见 docs/S3.md §2）
  #   endpoint: http://127.0.0.1:8333
  #   .env:    S3_ACCESS_KEY=dev
  #            S3_SECRET_KEY=dev          # 未配 IAM 时任意值
  #   验证：   PYTHONPATH=. python scripts/okf_push_s3.py --dry-run；再用 docs/S3.md §6 的 list_objects_v2 看对象
  #
  # 【启用示例 2：真实 S3 / MinIO】
  #   endpoint: https://s3.us-east-1.amazonaws.com   # MinIO 填 http://host:9000
  #   bucket: 你的桶名
  #   region: us-east-1
  #   .env:    S3_ACCESS_KEY=AKIA…
  #            S3_SECRET_KEY=…
  #   最小权限：HeadBucket / CreateBucket / PutObject / GetObject / DeleteObject /
  #            ListBucket / AbortMultipartUpload / ListMultipartUploads
  #
  # 只想开关：把 endpoint 改回 "" 即退回纯磁盘（已上传的大表仍留在 S3，不影响读旧数据）。

# --- Mirage 虚拟文件系统（graphs/access/mirage_backend.py，ADR-0018）---
# 开启方式：okf.backend: s3fs（此时 knowledge/ 不再被读，空间知识与上传文件都从对象存储走）。
mirage:
  # 审计/索引缓存用的 Redis；空 = 只用进程内缓存（单机开发）。
  redis_url: redis://127.0.0.1:6379/0
  cache_limit: 256MB            # Mirage 缓存上限（Redis 或进程内）
  index_ttl_seconds: 600        # 目录索引的 TTL；对象被外部改动时最多这么久后自愈

# --- 空间知识（shared/knowledge/root.py，ADR-0016）---
okf:
  backend: local                # local = 直接读仓库根 <dir>；s3 = 拉 S3 本地镜像（旧路径）；
                                # s3fs = Mirage 直读对象存储（ADR-0018，上传功能只在这个模式全开）
  dir: knowledge                # 空间根目录名（相对仓库根；数据不在代码包里）
  mirror_dir: .cache/okf        # s3 模式的镜像目录
  mirror_ttl_seconds: 0         # 0 = 只拉一次；改内容后跑 scripts/okf_pull_s3.py

# --- 图（graphs/supervisor.py）---
agents:
  # supervisor 给 AsyncSubAgent 用的服务地址；容器/换端口时改这里。
  server_url: http://127.0.0.1:2026

# --- 任务结果发件箱（custom/service/outbox_dispatcher.py，ADR-0010）---
outbox:
  poll_interval_seconds: 1.0
  batch_size: 50
  lease_seconds: 30
  busy_backoff_seconds: 2
  max_attempts: 10
  startup_delay_seconds: 5
  summary_timeout_seconds: 5
  # 分发者读子线程用的自调地址；留空 = http://127.0.0.1:<PORT>（PORT 取 aegra 原生配置）
  internal_url: ""
