[project]
name = "aegra-api"
version = "0.10.8"
description = "Aegra core API - Self-hosted Agent Protocol server"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Muhammad Ibrahim", email = "mibrahim37612@gmail.com" }]
keywords = ["langgraph", "agents", "llm", "fastapi", "agent-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core
    "fastapi>=0.110.1",
    # >=0.36.0: --loop accepts import strings (Windows selector loop, #513)
    "uvicorn>=0.36.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.14.2",
    # Imported directly in settings.py to load `.env` (already pulled in by pydantic-settings)
    "python-dotenv>=1.0.0",
    "sse-starlette>=3.3.4,<4.0.0",
    # Imported directly for CancelScope(shield=True); same floor sse-starlette sets
    "anyio>=4.14.2",
    # LangGraph
    "langgraph>=1.0.3",
    "langgraph-sdk>=0.3.5",
    "langgraph-checkpoint-postgres>=3.1.1",
    # Database
    "sqlalchemy>=2.0.0",
    "greenlet>=3.1.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.9",
    "alembic>=1.16.4",
    # Observability (OpenTelemetry)
    "opentelemetry-api>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-exporter-otlp>=1.39.1",
    "openinference-instrumentation-langchain>=0.1.58",
    # Metrics
    # >=8.0.2: 7.x reads route.path on FastAPI >=0.137's _IncludedRouter (which has
    # no .path), 500ing every request when metrics are on. 8.0.2 handles the new tree.
    "prometheus-fastapi-instrumentator>=8.0.2",
    # Utils
    "structlog>=25.4.0",
    "asgi-correlation-id>=4.3.4",
    # 读仓库根的 config.yaml（custom/project_config.py）
    "pyyaml>=6.0",
    # Redis (optional broker backend for multi-instance streaming)
    "redis[hiredis]>=5.0.0",
    # Cron expression parsing
    "croniter>=6.0.0",
    "deepagents[quickjs]>=0.7.23",
    "langchain-openai>=1.7.0",
    "pandas>=3.0.6",
    # pandas 读 xlsx 的引擎，pd.read_excel 没它直接 ImportError
    "openpyxl>=3.1.5",
    "bcrypt>=5.0.0",
    "boto3>=1.40.46,<1.40.62",
    "mirage-ai[s3]==0.0.7",
]

[project.urls]
Homepage = "https://github.com/aegra/aegra"
Documentation = "https://github.com/aegra/aegra#readme"
Repository = "https://github.com/aegra/aegra"
Issues = "https://github.com/aegra/aegra/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegra_api"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "aegra_api/alembic.ini"
"alembic" = "aegra_api/alembic"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
# This package's [tool.ruff] overrides the root config for files beneath it, so
# the markdown exclusion has to be repeated here. See the root pyproject.toml.
exclude = ["**/*.md"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # Within an except clause, raise exceptions with `raise ... from err`
    "ARG001", # Unused function argument
    "ARG002", # Unused method argument
    "ARG005", # Unused lambda argument
    "SIM108", # Use ternary operator (less readable in many cases)
]

[tool.ruff.lint.isort]
known-first-party = ["aegra_api", "aegra_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "e2e: end-to-end tests requiring a running server",
    "prod_only: tests that require Redis workers (skipped in dev mode)",
    "auth_only: tests that require an auth-enabled server (run with -m auth_only)",
    "manual_auth: auth tests that need extra server config, run by hand (run with -m manual_auth)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.0",
    "ty>=0.0.17,<0.1.0",
    "bandit>=1.8.0",
    "pre-commit>=4.0.1",
    "langchain-openai>=1.1.14",
    "langchain[mcp]>=1.4.4",
]
